name: Build Android_Ghosts Tunnels ARM64 APK

on:
  push:
    branches:
      - android-ghosts/ui-build-preview
    paths:
      - '.github/workflows/build-arm64.yml'
      - 'patches/**'
      - 'dnstt-ghosts-ui-openvpn-prep-source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    name: Build ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract source without corrupted prebuilt AAR
        run: |
          mkdir source
          unzip -q dnstt-ghosts-ui-openvpn-prep-source.zip -d source -x 'app/libs/ghostcore.aar'
          test -f source/core/go.mod
          test -f source/gradlew

      - name: Apply Android_Ghosts UI and build fixes
        run: |
          base64 -d patches/android_ghosts_ui.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/com/androidghosts/dnsttghosts/ProfileEditActivity.kt")
          s = p.read_text()
          imp = "import com.google.android.material.dialog.MaterialAlertDialogBuilder\n"
          if imp not in s:
              s = s.replace("import com.google.android.material.button.MaterialButton\n",
                            "import com.google.android.material.button.MaterialButton\n" + imp)
          p.write_text(s)
          PY
          base64 -d patches/hysteria2-engine.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          base64 -d patches/hysteria1-engine.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/core/engine/hysteria1.go")
          s = p.read_text().replace('quic "github.com/apernet/quic-go"', 'quic "github.com/lucas-clemente/quic-go"')
          p.write_text(s)
          p = Path("source/scripts/build-android-arm64.sh")
          s = p.read_text()
          s = s.replace(
              '# Pin the official Hysteria 2 core and its matching extras API.\n(cd core && go get ',
              '# Pin the official Hysteria 2 core and its matching extras API.\n'
              '(cd core && go mod edit -replace=github.com/lucas-clemente/quic-go=github.com/apernet/quic-go@v0.31.1-0.20221119235156-55bf700f2dd4)\n'
              '(cd core && go get '
          )
          target = "(cd core && go get github.com/apernet/hysteria/core/v2@v2.13.0 github.com/apernet/hysteria/extras/v2@v2.13.0 github.com/apernet/hysteria/pkg/core@v1.3.1-0.20221123081517-9eb0ea4367f3 github.com/apernet/hysteria/pkg/pktconns@v1.3.1-0.20221123081517-9eb0ea4367f3)"
          if target in s and "github.com/hashicorp/golang-lru/v2@v2.0.1" not in s:
              s = s.replace(target, target + "\n(cd core && go get github.com/hashicorp/golang-lru/v2@v2.0.1)")
          compat = """# Copy Hysteria 1 out of Go's read-only cache and adapt its obsolete ARC calls.
          H1_MOD_SRC="$(go env GOMODCACHE)/github.com/apernet/hysteria@v1.3.1-0.20221123081517-9eb0ea4367f3"
          H1_MOD_DST="$PWD/core/third_party/hysteria1"
          test -d "$H1_MOD_SRC"
          mkdir -p "$H1_MOD_DST"
          cp -R "$H1_MOD_SRC/." "$H1_MOD_DST/"
          chmod -R u+w "$H1_MOD_DST"
          H1_ACL_FILE="$H1_MOD_DST/pkg/acl/engine.go"
          sed -i 's/lru\\.ARCCache\\[cacheKey, cacheValue\\]/lru.Cache[cacheKey, cacheValue]/' "$H1_ACL_FILE"
          sed -i 's/lru\\.NewARC\\[cacheKey, cacheValue\\](entryCacheSize)/lru.New[cacheKey, cacheValue](entryCacheSize, nil)/' "$H1_ACL_FILE"
          (cd core && go mod edit -replace=github.com/apernet/hysteria=./third_party/hysteria1)"""
          if "Keep the old Hysteria 1 ACL cache API compatible" not in s:
              pin = "(cd core && go get github.com/hashicorp/golang-lru/v2@v2.0.1)"
              s = s.replace(pin, pin + "\n" + compat)
          p.write_text(s)
          PY
          chmod +x source/gradlew source/scripts/build-android-arm64.sh
          test -f source/app/src/main/res/menu/drawer_engine.xml

      - name: Package patched source snapshot for integration verification
        run: |
          mkdir -p /tmp/ghosts-source-review
          tar -czf /tmp/ghosts-source-review/source-review.tar.gz -C source \
            app/src/main/java/com/androidghosts/dnsttghosts \
            app/src/main/res/layout app/src/main/res/menu app/src/main/res/values app/src/main/res/values-ar \
            app/src/main/AndroidManifest.xml app/build.gradle.kts \
            core/go.mod core/go.sum core/engine core/ghostcore \
            scripts/build-android-arm64.sh \
            -C "$GITHUB_WORKSPACE" \
            patches/android_ghosts_ui.patch.gz.b64 patches/hysteria1-engine.patch.gz.b64 patches/hysteria2-engine.patch.gz.b64
      - name: Upload patched source review snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Android_Ghosts-source-review
          path: /tmp/ghosts-source-review/source-review.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Build native ghostcore AAR and APK
        working-directory: source
        run: ./scripts/build-android-arm64.sh

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Android_Ghosts-Tunnels-ARM64-debug-APK
          path: source/app/build/outputs/apk/debug/*arm64-v8a*debug.apk
          if-no-files-found: error
          retention-days: 14
