name: Build Android_Ghosts Tunnels Multi-ABI APK

on:
  push:
    branches:
      - android-ghosts/ui-build-preview
    paths:
      - '.github/workflows/build-arm64.yml'
      - 'patches/**'
      - 'dnstt-ghosts-ui-openvpn-prep-source.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build multi-ABI debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Configure preinstalled Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

      - name: Install Android platform and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Extract source without corrupted prebuilt AAR
        run: |
          mkdir source
          unzip -q dnstt-ghosts-ui-openvpn-prep-source.zip -d source -x 'app/libs/ghostcore.aar'
          test -f source/core/go.mod
          test -f source/gradlew

      - name: Apply Android_Ghosts UI and build fixes
        run: |
          base64 -d patches/android_ghosts_ui.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          base64 -d patches/hysteria2-engine.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          base64 -d patches/protocol-settings.patch.gz.b64 | gzip -dc | patch --directory source -p1 --batch
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/src/main/java/com/androidghosts/dnsttghosts/ProfileEditActivity.kt")
          s = p.read_text()
          imp = "import com.google.android.material.dialog.MaterialAlertDialogBuilder\n"
          if imp not in s:
              s = s.replace("import com.google.android.material.button.MaterialButton\n",
                            "import com.google.android.material.button.MaterialButton\n" + imp)
          p.write_text(s)

          # Apply native build cleanup and unit tests after the Hysteria 2 module is pinned.
          script = Path("source/scripts/build-android-arm64.sh")
          build = script.read_text()
          anchor = '(cd core && go get github.com/apernet/hysteria/core/v2@v2.13.0 github.com/apernet/hysteria/extras/v2@v2.13.0)\nMOBILE_VERSION="$(cd core && go list -m -f \'{{.Version}}\' golang.org/x/mobile)"'
          addition = anchor + "\n(cd core && go mod tidy)\n(cd core && go get golang.org/x/mobile@${MOBILE_VERSION})\n(cd core && go test ./engine ./ghostcore)"
          if "go mod tidy" not in build:
              if anchor not in build:
                  raise SystemExit("Could not locate Go dependency setup in build-android-arm64.sh")
              build = build.replace(anchor, addition, 1)
              script.write_text(build)

          # Validate protocol-specific config without constructing a DNSTT tunnel for Hysteria 2.
          core = Path("source/core/ghostcore/ghostcore.go")
          c = core.read_text()
          old_check = "if err == nil {\n\t\t_, err = engine.NewTunnel(cfg)\n\t}"
          new_check = "// NewTunnel is the DNSTT backend; Hysteria 2 validates statically in ParseConfig.\n\tif err == nil && cfg.Protocol == \"dnstt\" {\n\t\t_, err = engine.NewTunnel(cfg)\n\t}"
          if old_check in c:
              c = c.replace(old_check, new_check, 1)
              core.write_text(c)
          elif new_check not in c:
              raise SystemExit("Could not locate CheckConfig backend validation in ghostcore.go")

          profile_activity = Path("source/app/src/main/java/com/androidghosts/dnsttghosts/ProfileEditActivity.kt")
          s = profile_activity.read_text()
          old_save = 'if (out.optString("protocol", "dnstt") == "dnstt") {'
          new_save = 'val activeProtocol = out.optString("protocol", "dnstt")\n            if (activeProtocol == "dnstt" || activeProtocol == "hysteria2") {'
          if old_save in s:
              s = s.replace(old_save, new_save, 1)
              profile_activity.write_text(s)
          elif "activeProtocol == \"dnstt\" || activeProtocol == \"hysteria2\"" not in s:
              raise SystemExit("Could not locate profile validation handler")

          strings = Path("source/app/src/main/res/values/strings.xml")
          t = strings.read_text()
          t = t.replace("This profile format is supported, but its connection engine is not integrated in this build. Only DNSTT can connect right now.", "This profile format can be saved, but its connection engine is not integrated in this build. Active engines: DNSTT and Hysteria 2.")
          strings.write_text(t)

          # Compress native Go libraries inside the APK to reduce download size.
          gradle = Path("source/app/build.gradle.kts")
          g = gradle.read_text()
          if "useLegacyPackaging = true" not in g:
              marker = "android {"
              if marker not in g:
                  raise SystemExit("Could not find android { block in app/build.gradle.kts")
              g = g.replace(marker, marker + "\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }\n", 1)
              gradle.write_text(g)
          PY
          chmod +x source/gradlew source/scripts/build-android-arm64.sh
          test -f source/app/src/main/res/menu/drawer_engine.xml

      - name: Prepare source snapshot for protocol verification
        run: |
          tar -czf Android_Ghosts-source-review.tar.gz -C source \
            app/src/main/java app/src/main/res app/src/main/AndroidManifest.xml \
            app/build.gradle.kts core/engine core/ghostcore core/go.mod \
            scripts/build-android-arm64.sh ENGINE_STATUS.md

      - name: Configure native build for all Android ABIs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/scripts/build-android-arm64.sh")
          s = p.read_text()
          # gomobile bind packages the selected Android ABIs into one AAR.
          targets = "-target=android/arm64,android/arm,android/amd64,android/386"
          if targets not in s:
              old = "-target=android/arm64"
              if old not in s:
                  raise SystemExit("Native build script has no recognized gomobile Android target; refusing to publish a misleading multi-ABI APK.")
              s = s.replace(old, targets)
          p.write_text(s)
          PY

      - name: Build native ghostcore AAR and APK
        working-directory: source
        run: ./scripts/build-android-arm64.sh

      - name: Verify APK ABI coverage
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find source/app/build/outputs/apk -type f -name '*.apk' | sort)
          test "${#APKS[@]}" -gt 0
          : > /tmp/native-abis.txt
          for APK in "${APKS[@]}"; do
            echo "Inspecting $APK"
            unzip -l "$APK" | grep -E 'lib/(arm64-v8a|armeabi-v7a|x86_64|x86)/.*\.so$' >> /tmp/native-abis.txt || true
          done
          cat /tmp/native-abis.txt
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            grep -q "lib/$abi/" /tmp/native-abis.txt || { echo "Missing native ABI across APK outputs: $abi"; exit 1; }
          done

      - name: Upload multi-ABI APKs
        uses: actions/upload-artifact@v4
        with:
          name: Android_Ghosts-Tunnels-Multi-ABI-debug-APKs
          path: source/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload protocol source snapshot for review
        uses: actions/upload-artifact@v4
        with:
          name: Android_Ghosts-source-review
          path: Android_Ghosts-source-review.tar.gz
          if-no-files-found: error
          retention-days: 3
